<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Institutional Confidence Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <header>
        <div class="header-content">
            <h1>ARC <span class="glow">Institutional</span> Confidence</h1>
            <p>Live Asset Analysis & Execution Agent</p>
            
            <div class="header-controls">
                <button id="connectWallet" class="btn-wallet-premium">Connect Wallet</button>
                <div class="premium-search-box">
                    <input type="text" id="searchInput" placeholder="Search Wallet / Tx Hash...">
                    <button id="searchBtn" class="btn-search-glow">SEARCH</button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Row 1: Metrics & Chart -->
        <section class="metrics-row">
            <div class="card chart-card">
                <h3>USDC Market Cap (ARC)</h3>
                <div class="value-group">
                    <span class="main-value">$260.36 B</span>
                    <span class="trend up">+0.15%</span>
                </div>
                <div class="chart-container">
                    <canvas id="marketChart"></canvas>
                </div>
            </div>

            <div class="stats-column">
                <div class="card mini-card">
                    <p>Block Height</p>
                    <h2 id="blockHeight" class="glow-text">41.903.322</h2>
                </div>
                <div class="card mini-card">
                    <p>Finality Speed</p>
                    <h2 class="glow-text">1.50s</h2>
                </div>
                <div class="card mini-card">
                    <p>Network Txs</p>
                    <h2 id="networkTxs" class="glow-text">--</h2>
                </div>
            </div>
        </section>

        <!-- Row 2: AICD Forge (Agentic Execution) -->
        <section class="card forge-section">
            <div class="forge-header">
                <h2>AICD Forge: Agentic Execution</h2>
                <span class="status-badge">Ready to Sync</span>
            </div>
            
            <div class="forge-grid">
                <div class="action-box">
                    <h4>CCTP Bridge</h4>
                    <select id="bridgeDirection">
                        <option value="sep-arc">Sepolia → ARC</option>
                        <option value="arc-sep">ARC → Sepolia</option>
                    </select>
                    <input type="number" placeholder="USDC Amount">
                    <button class="btn-forge">Execute Bridge</button>
                </div>

                <div class="action-box">
                    <h4>Smart Swap</h4>
                    <div class="swap-inputs">
                        <select id="tokenIn">
                            <option>USDC</option>
                            <option>EUROC</option>
                        </select>
                        <span class="arrow">→</span>
                        <select id="tokenOut">
                            <option>SYN</option>
                            <option>EUROC</option>
                            <option>USDC</option>
                        </select>
                    </div>
                    <input type="number" placeholder="Amount">
                    <button class="btn-forge">Confirm Swap</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
